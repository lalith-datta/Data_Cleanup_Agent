# ============================================================
# TARGET SCHEMA — Employee (v1)
# The canonical spec the agent maps every source file into.
# Deterministic-first: `aliases` power fuzzy header matching;
# the LLM is only consulted when matching is ambiguous.
# ============================================================
entity: employee
primary_key: employee_id

# How the agent reconciles the SAME person across files.
# email is the stable key (IDs differ: "E1001" in HR vs "1001" in CRM).
match_keys:
  - email
  - employee_id

fields:
  employee_id:
    type: string
    required: true
    description: Unique employee code in the new platform.
    aliases: [emp id, employeecode, id, employee code, staff id]

  full_name:
    type: string
    required: true
    aliases: [employee name, name, fullname, full name]

  email:
    type: email
    required: true
    aliases: [work email, email_address, email, official email]
    notes: Work email is canonical. A personal email is NOT this field.

  phone:
    type: string
    required: false
    aliases: [mobile, phone, contact number, mobile number]

  department:
    type: string
    required: false
    aliases: [dept, team, department, division]

  job_title:
    type: string
    required: false
    aliases: [designation, title, role, job title]

  date_of_joining:
    type: date
    format: "YYYY-MM-DD"
    required: true
    aliases: [doj, joined_on, dateofjoining, joining date, date of joining]

  date_of_birth:
    type: date
    format: "YYYY-MM-DD"
    required: false
    aliases: [dob, birth date, date of birth]

  manager_email:
    type: email
    required: false
    aliases: [reporting manager email, manager email, manager]
    notes: Source may provide a manager NAME instead of an email — resolve via lookup or escalate.

  location:
    type: string
    required: false
    aliases: [office location, city, location, work location]

  employment_status:
    type: enum
    required: false
    allowed: [active, inactive, on_leave]
    aliases: [status, employment status, state]

  salary:
    type: number
    required: false
    aliases: [ctc, salary, annual salary, compensation]

# Value-level normalization the agent applies automatically (STP wins).
enum_normalization:
  employment_status:
    active:   [active, a, working]
    inactive: [inactive, terminated, resigned, exited]
    on_leave: [on leave, on_leave, leave, sabbatical]

# Source columns with no confident target (e.g. "Grade", "BankName",
# "EmploymentType") are surfaced, not silently dropped.
unmapped_source_columns_policy: escalate
